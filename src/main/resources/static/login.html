<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Davity Guías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <img src="images/logo.jpg" alt="Logo Davity" style="max-height: 60px;" class="mb-2">
                            <h3>Acceso a Davity</h3>
                            <p class="text-muted">Ingresa para acceder a tus guías y walkthroughs</p>
                        </div>

                        <!-- Alerta de Bootstrap para errores -->
                        <div id="alertaLogin" class="alert alert-danger d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correo" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="contrasena" required>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-dark btn-lg">Ingresar</button>
                            </div>
                        </form>

                        <div class="text-center">
                            <small>¿No tienes cuenta? <a href="index.html">Regístrate aquí</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
