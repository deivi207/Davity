<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Davity Guías</title>
    <!-- Carga de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu archivo CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row align-items-center mb-4">
            <div class="col-auto">
                <img src="images/logo.jpg" alt="Logo Davity" style="max-height: 60px;">
            </div>
            <div class="col">
                <h2 class="mb-0">Registro y Suscripción - Davity</h2>
                <p class="text-muted mb-0">Accede a nuestras guías exclusivas y walkthroughs de videojuegos</p>
            </div>
            <div class="col-auto">
                <a href="login.html" class="btn btn-outline-dark">Ya tengo cuenta (Iniciar Sesión)</a>
            </div>
        </div>

        <form id="registroForm" class="row justify-content-center">
            <!-- 1. Selección de Plan -->
            <div class="col-md-10 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">1. Elige tu plan</div>
                    <div class="card-body">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="planType" id="planMensual" value="Mensual" checked>
                            <label class="form-check-label" for="planMensual">
                                <strong>Pase Mensual ($10)</strong> — Acceso a todas las Guías en PDF
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="planType" id="planAnual" value="Anual">
                            <label class="form-check-label" for="planAnual">
                                <strong>Pase Anual ($90)</strong> — Guías en PDF + Video Walkthroughs Completos
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Datos Personales -->
            <div class="col-md-10 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">2. Datos Personales</div>
                    <div class="card-body row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Cédula (Documento de Identidad)</label>
                            <input type="number" class="form-control" id="id" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreCompleto" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoElectronico" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="contrasena" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Celular</label>
                            <input type="text" class="form-control" id="celular" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fechaNacimiento" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Edad</label>
                            <input type="number" class="form-control" id="edad" readonly required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">País</label>
                            <input type="text" class="form-control" id="pais" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Región / Estado</label>
                            <input type="text" class="form-control" id="region" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Código Postal</label>
                            <input type="number" class="form-control" id="codigoPostal" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Datos de Pago -->
            <div class="col-md-10 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">3. Información de Pago</div>
                    <div class="card-body row g-3">
                        <div class="col-md-5">
                            <label class="form-label">Nombre del titular de la tarjeta</label>
                            <input type="text" class="form-control" id="nombreTitularTarjeta" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Número de Tarjeta</label>
                            <input type="text" class="form-control" id="tarjetaCreditoDebito" placeholder="0000 0000 0000 0000" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Fecha de Vencimiento</label>
                            <input type="date" class="form-control" id="fechaVencimiento" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón de envío -->
            <div class="col-md-10 d-grid">
                <button type="submit" class="btn btn-dark btn-lg">Completar Registro y Suscripción</button>
            </div>
        </form>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
