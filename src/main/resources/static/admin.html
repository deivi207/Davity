<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Davity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="mb-0">Gestión de Clientes - Davity</h2>
                <p class="text-muted mb-0">Consulta, edita o elimina suscripciones registradas</p>
            </div>
            <div>
                <a href="index.html" class="btn btn-outline-dark me-2">+ Nuevo Registro</a>
                <button id="btnRecargar" class="btn btn-primary">Actualizar Lista</button>
            </div>
        </div>

        <!-- Tabla de Clientes (READ) -->
        <div class="card shadow-sm">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre Completo</th>
                            <th>Correo</th>
                            <th>Celular</th>
                            <th>Plan</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientesBody">
                        <!-- Los registros se cargan dinámicamente con admin.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Cliente (UPDATE) -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Editar Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formEditar">
                    <div class="modal-body">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="editNombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="editCorreo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Celular</label>
                            <input type="text" class="form-control" id="editCelular" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Plan de Suscripción</label>
                            <select class="form-select" id="editSuscripcion">
                                <option value="Mensual">Mensual</option>
                                <option value="Anual">Anual</option>
                            </select>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="editEstado">
                            <label class="form-check-label" for="editEstado">Suscripción Activa</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (necesario para abrir y cerrar el modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
