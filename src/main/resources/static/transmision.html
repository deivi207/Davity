<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Guías - Davity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <!-- Barra superior -->
    <nav class="navbar navbar-dark bg-black px-4 py-3 border-bottom border-secondary">
        <div class="d-flex align-items-center">
            <img src="images/logo.jpg" alt="Logo Davity" style="max-height: 40px;" class="me-3">
            <span class="navbar-brand mb-0 h1">Davity Guías</span>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span id="infoUsuario" class="text-light small"></span>
            <span id="badgePlan" class="badge bg-primary"></span>
            <button id="btnCerrarSesion" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <!-- Banner de mejora de plan (solo visible para Plan Mensual) -->
        <div id="bannerUpgrade" class="alert alert-warning d-none justify-content-between align-items-center flex-wrap gap-3 mb-4" role="alert">
            <div>
                <strong>Tienes el Plan Mensual:</strong> Disfruta todas nuestras guías en PDF. ¿Quieres desbloquear los walkthroughs completos?
            </div>
            <button id="btnMejorarBanner" class="btn btn-dark btn-sm fw-bold">
                Mejorar a Plan Anual ($90)
            </button>
        </div>

        <!-- Contenedor dinámico de las 3 guías -->
        <div id="listaGuias"></div>

        <!-- Sección Próximamente sin nombres específicos -->
        <hr class="border-secondary my-5">
        <div class="card bg-black text-center border-secondary py-4 shadow">
            <div class="card-body">
                <span class="badge bg-secondary mb-2">EN PRODUCCIÓN</span>
                <h4 class="text-white mb-1">Más próximamente...</h4>
                <p class="text-secondary mb-0">Nuevas guías en PDF y video walkthroughs incluidos automáticamente en tu suscripción.</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/clientes';
        const datosSesion = sessionStorage.getItem('clienteActivo');

        if (!datosSesion) {
            window.location.href = 'login.html';
        }

        let usuario = JSON.parse(datosSesion);

        // Catálogo de guías disponibles
        const CATALOGO_GUIAS = [
            {
                titulo: 'Hollow Knight',
                subtitulo: 'Mapas, amuletos, jefes secretos y ruta completa al 112%.',
                tituloPdf: 'Manual Completo de Hallownest',
                descripcionPdf: 'Incluye checklist de objetos, ubicación de todos los gusanos, estrategias contra jefes y rutas recomendadas.',
                rutaPdf: 'docs/hollow-knight-guia.pdf',
                nombreDescarga: 'Guia-Hollow-Knight-Davity.pdf',
                videoId: 'G1atkq4C1KU',
                descripcionVideo: 'Walkthrough completo sin comentarios (4K 60FPS).'
            },
            {
                titulo: 'Tunic',
                subtitulo: 'Traducción del manual, secretos, hadas y guía completa de exploración.',
                tituloPdf: 'Guía de Exploración y Secretos',
                descripcionPdf: 'Páginas del manual descifradas, ubicación de mejoras, jefes y solución de acertijos.',
                rutaPdf: 'docs/tunic-guia.pdf',
                nombreDescarga: 'Guia-Tunic-Davity.pdf',
                videoId: '7ozwLHxw33Q',
                descripcionVideo: 'Walkthrough completo al 100% de logros sin comentarios.'
            },
            {
                titulo: 'ENDER LILIES: Quietus of the Knights',
                subtitulo: 'Ubicación de espíritus, reliquias, jefes y finales de Finisterra.',
                tituloPdf: 'Compendio de Finisterra',
                descripcionPdf: 'Mapa de zonas al 100%, mejores combinaciones de espíritus y requisitos para el final verdadero.',
                rutaPdf: 'docs/ENDER-LILIES-Quietus-of-the-Knights-Guide.pdf',
                nombreDescarga: 'Guia-Ender-Lilies-Davity.pdf',
                videoId: 'oOKHohEWdkg',
                descripcionVideo: 'Walkthrough completo hasta el final verdadero sin comentarios.'
            }
        ];

        function renderizarPortal() {
            document.getElementById('infoUsuario').textContent = `Hola, ${usuario.nombre}`;
            const badgePlan = document.getElementById('badgePlan');
            const bannerUpgrade = document.getElementById('bannerUpgrade');
            const listaGuias = document.getElementById('listaGuias');
            const esAnual = usuario.plan === 'Anual';

            if (esAnual) {
                badgePlan.textContent = 'Plan Anual';
                badgePlan.className = 'badge bg-warning text-dark';
                bannerUpgrade.classList.add('d-none');
                bannerUpgrade.classList.remove('d-flex');
            } else {
                badgePlan.textContent = 'Plan Mensual';
                badgePlan.className = 'badge bg-primary';
                bannerUpgrade.classList.remove('d-none');
                bannerUpgrade.classList.add('d-flex');
            }

            listaGuias.innerHTML = CATALOGO_GUIAS.map((guia, index) => {
                const bloqueVideo = esAnual
                    ? `
                        <div class="ratio ratio-16x9 rounded overflow-hidden border border-secondary mb-2">
                            <iframe src="https://www.youtube.com/embed/${guia.videoId}"
                                    title="Walkthrough ${guia.titulo}"
                                    allowfullscreen></iframe>
                        </div>
                        <small class="text-secondary">${guia.descripcionVideo}</small>
                    `
                    : `
                        <div class="text-center py-4 px-3">
                            <h5 class="text-warning mb-2">Contenido Exclusivo del Plan Anual</h5>
                            <p class="text-secondary mb-4">
                                Tu plan <strong>Mensual</strong> incluye el PDF de <strong>${guia.titulo}</strong>, 
                                pero el video walkthrough completo está reservado para suscriptores anuales.
                            </p>
                            <button class="btn btn-warning fw-bold btn-mejorar-inline">
                                Mejorar a Plan Anual ahora ($90)
                            </button>
                        </div>
                    `;

                const badgeVideo = esAnual
                    ? '<span class="badge bg-warning text-dark">Exclusivo Anual - Desbloqueado</span>'
                    : '<span class="badge bg-danger">Bloqueado (Solo Plan Anual)</span>';

                return `
                    <div class="${index > 0 ? 'mt-5 pt-4 border-top border-secondary' : ''}">
                        <div class="mb-3">
                            <span class="badge bg-success mb-2">DISPONIBLE AHORA</span>
                            <h2>Guía Oficial: ${guia.titulo}</h2>
                            <p class="text-secondary">${guia.subtitulo}</p>
                        </div>

                        <div class="row g-4">
                            <div class="col-lg-5">
                                <div class="card bg-black text-white border-secondary h-100 shadow">
                                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                                        <span class="fw-bold">1. Guía Escrita en PDF</span>
                                        <span class="badge bg-success">Desbloqueado</span>
                                    </div>
                                    <div class="card-body d-flex flex-column justify-content-between">
                                        <div>
                                            <h5 class="card-title">${guia.tituloPdf}</h5>
                                            <p class="card-text text-secondary">${guia.descripcionPdf}</p>
                                        </div>
                                        <div class="d-grid gap-2 mt-3">
                                            <a href="${guia.rutaPdf}" target="_blank" class="btn btn-outline-light">
                                                Ver Guía en el Navegador
                                            </a>
                                            <a href="${guia.rutaPdf}" download="${guia.nombreDescarga}" class="btn btn-primary">
                                                Descargar PDF
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-7">
                                <div class="card bg-black text-white border-secondary h-100 shadow">
                                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                                        <span class="fw-bold">2. Video Walkthrough Completo</span>
                                        ${badgeVideo}
                                    </div>
                                    <div class="card-body">
                                        ${bloqueVideo}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.btn-mejorar-inline').forEach(btn => {
                btn.addEventListener('click', mejorarAPlanAnual);
            });
        }

        async function mejorarAPlanAnual() {
            if (!usuario.id) {
                alert('Vuelve a iniciar sesión para habilitar la actualización automática.');
                return;
            }
            if (!confirm('¿Deseas actualizar tu suscripción de Mensual a Anual para desbloquear todos los walkthroughs?')) {
                return;
            }

            try {
                const resGet = await fetch(`${API_URL}/${usuario.id}`);
                if (!resGet.ok) throw new Error('No se pudo obtener el cliente');
                const clienteCompleto = await resGet.json();

                clienteCompleto.suscripcion = 'Anual';
                const resPut = await fetch(`${API_URL}/${usuario.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clienteCompleto)
                });

                if (resPut.ok) {
                    usuario.plan = 'Anual';
                    sessionStorage.setItem('clienteActivo', JSON.stringify(usuario));
                    alert('¡Felicidades! Tu cuenta ahora es Plan Anual. Todos los video walkthroughs han sido desbloqueados.');
                    renderizarPortal();
                } else {
                    alert('No se pudo actualizar el plan en el servidor.');
                }
            } catch (error) {
                console.error(error);
                alert('Error de conexión al intentar mejorar el plan.');
            }
        }

        document.getElementById('btnMejorarBanner').addEventListener('click', mejorarAPlanAnual);

        document.getElementById('btnCerrarSesion').addEventListener('click', () => {
            sessionStorage.removeItem('clienteActivo');
            window.location.href = 'login.html';
        });

        renderizarPortal();
    </script>
</body>
</html>
